name: review-gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Use the actual pushed range for main checks
        if: github.event_name == 'push'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          if ! [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$PREVIOUS_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo 'A valid previous main revision is required for publication checks.'
            exit 1
          fi
          git cat-file -e "${PREVIOUS_SHA}^{commit}"
      - name: Scan changes for secrets
        env:
          REVIEW_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: npm run review:gate -- --base "$REVIEW_BASE" --secrets-only
